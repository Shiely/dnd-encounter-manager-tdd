[project]
name = "dnd-encounter-manager"
version = "0.5.0"
description = "Hexagonal-architecture D&D 5e encounter manager"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
    "pydantic>=2.7",
    "jsonschema>=4.22",
    "platformdirs>=4.2",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "import-linter>=2.1",
    "pytest-qt>=4.4",
]

[project.scripts]
dnd-encounter-manager = "dnd_encounter.main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/dnd_encounter --cov-report=term-missing -q"

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
explicit_package_bases = true
files = ["src/dnd_encounter", "tests"]

[tool.ruff]
line-length = 150
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N"]

[tool.importlinter]
root_packages = ["dnd_encounter"]
src_roots = ["src"]

[[tool.importlinter.contracts]]
name = "Domain has no external imports"
type = "forbidden"
source_modules = ["dnd_encounter.domain"]
forbidden_modules = [
    "dnd_encounter.ports",
    "dnd_encounter.application",
    "dnd_encounter.adapters",
    "pydantic",
    "PySide6",
    "jsonschema",
]

[[tool.importlinter.contracts]]
name = "Application does not import adapters"
type = "forbidden"
source_modules = ["dnd_encounter.application"]
forbidden_modules = ["dnd_encounter.adapters", "PySide6", "jsonschema"]

[[tool.importlinter.contracts]]
name = "Ports do not import application or adapters"
type = "forbidden"
source_modules = ["dnd_encounter.ports"]
forbidden_modules = ["dnd_encounter.application", "dnd_encounter.adapters"]
